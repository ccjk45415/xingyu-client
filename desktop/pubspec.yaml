name: xingyu_desktop
description: 仓库 · 星屿 Android、Windows 与 macOS Flutter 客户端
publish_to: none
version: 0.6.0+25
environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_widget_from_html_core: ^0.17.4
  file_selector: ^1.1.0
  url_launcher: ^6.3.3
  path_provider: ^2.1.5
  flutter_avif: ^3.1.0
  flutter_avif_platform_interface: ^3.1.0
  image: ^4.5.4
  html: ^0.15.6
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  crypto: ^3.0.7
  cryptography: ^2.9.0
  shorebird_code_push: ^2.0.7
  zxing2: ^0.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/submission-guidance.json
    - assets/native-media-notices.txt
    - assets/windows-update.ps1
    - shorebird.yaml
